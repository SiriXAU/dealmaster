name: Create tag and GitHub Release

# Triggers only when package.json is updated on main — which only happens
# when a release bump PR (from bump-version.yml) is merged.
# Covers all three GitHub merge strategies:
#   - squash/rebase: head_commit message = "chore: bump version to vX.Y.Z"
#   - merge commit:  head_commit message = "Merge pull request #N from .../release/vX.Y.Z"
on:
  push:
    branches: [main]
    paths: ['package.json']

jobs:
  release:
    if: |
      startsWith(github.event.head_commit.message, 'chore: bump version to v') ||
      contains(github.event.head_commit.message, '/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create tags and releases
      packages: write   # let publish.yml pick up the tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag ${{ steps.ver.outputs.tag }} -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin ${{ steps.ver.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.ver.outputs.tag }} \
            --title "dealmaster ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --verify-tag
